[package]
name = "waste-it-bot"
version = "0.1.0"
edition = "2024"

[profile.release]
incremental = true

[dependencies]
dotenvy = "0.15.7"
dptree = "0.5.1"
env_logger = "0.11.12"
log = { version = "0.4.35", features = ["std"] }
reqwest = "0.13.5"
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
